name: Manual Inbox Summary Notifier

on:
  workflow_dispatch:
    inputs:
      reason:
        description: 'Reason for running the workflow'
        required: false
        default: 'Checking inbox contents'

jobs:
  send-inbox-summary:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Prepare and Send Summary
        run: |
          # Check if the _inbox directory exists.
          if [ ! -d "_inbox" ]; then
            MESSAGE="Your Cortagora repository does not have an _inbox folder yet."
          else
            # List the contents of the _inbox, one item per line.
            # This handles files and folders.
            INBOX_CONTENTS=$(ls -1 _inbox)

            # Check if the inbox is empty.
            if [ -z "$INBOX_CONTENTS" ]; then
              MESSAGE="✅ Your Cortagora inbox is empty. Great job!"
            else
              # If not empty, format the message with a header and the list.
              HEADER="📬 *Cortagora Inbox Triage*\n\nYou have the following items to process:\n"
              # Prepend each item with a dash for a clean list look.
              FORMATTED_LIST=$(echo "$INBOX_CONTENTS" | sed 's/^/- /')
              MESSAGE="$HEADER\n$FORMATTED_LIST"
            fi
          fi

          # Send the final composed message to Telegram.
          # The -s flag silences curl's progress output.
          # The --data-urlencode flag is used for 'text' to correctly handle newlines and special characters.
          curl -s -X POST "https://api.telegram.org/bot${{ secrets.INBOX_BOT_TOKEN }}/sendMessage" \
          --data-urlencode "chat_id=${{ secrets.INBOX_CHAT_ID }}" \
          --data-urlencode "parse_mode=Markdown" \
          --data-urlencode "text=${MESSAGE}"
