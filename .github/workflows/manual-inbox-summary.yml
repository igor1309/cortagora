name: Manual Inbox Summary Notifier

on:
  workflow_dispatch:
    inputs:
      reason:
        description: 'Reason for running the workflow'
        required: false
        default: 'Checking inbox contents'

jobs:
  send-inbox-summary:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Prepare and Send Summary
        env:
          BOT_TOKEN: ${{ secrets.INBOX_BOT_TOKEN }}
          CHAT_ID: ${{ secrets.INBOX_CHAT_ID }}
        run: |
          if [ ! -d "_inbox" ]; then
            MESSAGE="Your Cortagora repository does not have an _inbox folder yet."
          else
            # Use find to get a reliable list of items. This handles spaces in names better than ls.
            INBOX_ITEMS=$(find _inbox -maxdepth 1 -mindepth 1 -printf "%f\n")

            if [ -z "$INBOX_ITEMS" ]; then
              MESSAGE="✅ Your Cortagora inbox is empty. Great job!"
            else
              HEADER=$'📬 *Cortagora Inbox Triage*\n\nYou have the following items to process:\n'
              FORMATTED_LIST=""

              # Loop through each item to check its type (file or directory).
              while IFS= read -r item; do
                if [ -d "_inbox/$item" ]; then
                  # If it's a directory, append the suffix.
                  LINE="- \`$item (folder)\`"
                else
                  # If it's a file, format as before.
                  LINE="- \`$item\`"
                fi
                
                # Append the newly formatted line to our list.
                FORMATTED_LIST="${FORMATTED_LIST}${LINE}"$'\n'
              done <<< "$INBOX_ITEMS"
              
              MESSAGE="${HEADER}${FORMATTED_LIST}"
            fi
          fi

          curl -s -X POST "https://api.telegram.org/bot${BOT_TOKEN}/sendMessage" \
          --data-urlencode "chat_id=${CHAT_ID}" \
          --data-urlencode "parse_mode=MarkdownV2" \
          --data-urlencode "text=${MESSAGE}"