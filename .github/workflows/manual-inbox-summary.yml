# .github/workflows/manual-in-box-summary.yml

name: Inbox Summary Notifier

# THE CHANGE IS HERE: Added the 'schedule' trigger
on:
  # This allows the workflow to be triggered on a schedule
  schedule:
    - cron: '0 2 * * 6' # Saturday at 2:00 AM UTC
    - cron: '0 2 * * 0' # Sunday at 2:00 AM UTC

  # This allows the workflow to be triggered manually from the GitHub Actions tab
  workflow_dispatch:
    inputs:
      reason:
        description: 'Reason for running the workflow'
        required: false
        default: 'Manual run'

jobs:
  send-inbox-summary:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Prepare and Send Summary
        env:
          BOT_TOKEN: ${{ secrets.INBOX_BOT_TOKEN }}
          CHAT_ID: ${{ secrets.INBOX_CHAT_ID }}
        run: |
          if [ ! -d "_inbox" ]; then
            MESSAGE="Your Cortagora repository does not have an _inbox folder yet."
          else
            FORMATTED_LIST=$(
              CURRENT_MONTH_HEADER=""
              find _inbox -maxdepth 1 -mindepth 1 -printf "%TY-%Tm|%f\0" | sort -rz | \
              while IFS='|' read -r -d '' month_key filename; do
                NEW_MONTH_HEADER=$(date -d "${month_key}-01" "+%-B %Y")
                
                if [ "$NEW_MONTH_HEADER" != "$CURRENT_MONTH_HEADER" ]; then
                  echo ""
                  echo "$NEW_MONTH_HEADER"
                  echo "--------------------"
                  CURRENT_MONTH_HEADER="$NEW_MONTH_HEADER"
                fi

                if [ -d "_inbox/$filename" ]; then
                  echo "- $filename (folder)"
                else
                  echo "- $filename"
                fi
              done
            )

            if [ -z "$FORMATTED_LIST" ]; then
              MESSAGE="✅ Your Cortagora inbox is empty. Great job!"
            else
              HEADER=$'📬 *Cortagora Inbox Triage*\n\nYou have the following items to process:\n'
              MESSAGE="${HEADER}"$'```'"${FORMATTED_LIST}"$'\n```'
            fi
          fi

          curl -s -X POST "https://api.telegram.org/bot${BOT_TOKEN}/sendMessage" \
          --data-urlencode "chat_id=${CHAT_ID}" \
          --data-urlencode "parse_mode=Markdown" \
          --data-urlencode "text=${MESSAGE}"