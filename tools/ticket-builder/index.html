<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Cortagora Ticket Builder</title>
    <!-- Link to the external stylesheet -->
    <link rel="stylesheet" href="styles.css">
    <!-- Include the marked.js library for Markdown parsing -->
    <script src="https://cdn.jsdelivr.net/npm/marked/marked.min.js"></script>
</head>
<body>

    <main>
        <!-- Section for Guiding Principles -->
        <section id="principles-section">
            <details>
                <summary>Show/Hide Guiding Principles</summary>
                <div id="readme-content">Loading principles...</div>
            </details>
        </section>

        <hr>

        <!-- Section for GitHub Configuration -->
        <section id="config-section">
            <h3>Configuration</h3>
            <label for="repo-path" id="repo-label">GitHub Repo (owner/repo):</label>
            <input type="text" id="repo-path" aria-labelledby="repo-label" aria-required="true" placeholder="e.g., my-username/cortagora-project">

            <label for="github-pat" id="pat-label">GitHub Personal Access Token:</label>
            <input type="password" id="github-pat" aria-labelledby="pat-label" aria-required="true" placeholder="ghp_...">

            <button id="save-button">Save Settings & Load</button>
        </section>

        <hr id="config-hr" style="display: none;">

        <!-- Main App Sections (Initially Hidden) -->
        <div id="main-app-container" style="display: none;">
            <section id="task-section">
                <h3>1. Define Task</h3>
                <textarea id="task-input" rows="3" placeholder="Describe the core task... e.g., 'Invent a character past based on this story'"></textarea>
                <textarea id="context-input" rows="3" placeholder="Provide any additional context or constraints..."></textarea>
            </section>

            <section id="components-section">
                <h3>2. Select Components</h3>

                <label for="modality-select">Modality:</label>
                <select id="modality-select"><option>-- Load settings first --</option></select>

                <label>Personas:</label>
                <div id="personas-container"><p>-- Load settings first --</p></div>

                <label for="knowledge-path">Ticket Context Path:</label>
                <input type="text" id="knowledge-path" list="knowledge-path-list" placeholder="e.g., semi-RAG/ticket-001-character-past">
                <datalist id="knowledge-path-list"></datalist>
            </section>

            <section id="action-section">
                <hr>
                <h3>3. Generate</h3>
                <button id="generate-button" disabled>Generate Ticket</button>
            </section>

            <section id="output-section">
                <h3>Result</h3>
                <button id="copy-button" style="display: none;">Copy to Clipboard</button>
                <pre><code id="output-code">-- Your generated ticket will appear here --</code></pre>
            </section>
        </div>

        <footer id="status-area">
            <p>Status: Waiting for configuration.</p>
        </footer>
    </main>

    <!--
      Load the main script as a module. It will be responsible for importing other scripts.
      The 'defer' attribute is implicitly enabled for modules, but we keep it for clarity.
    -->
    <script type="module" src="script.js" defer></script>
</body>
</html>
